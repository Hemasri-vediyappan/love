<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 90vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 0.95em;
      opacity: 0.9;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
    }

    /* Statistics */
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.85em;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Input Section */
    .input-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 2px solid #e9ecef;
    }

    .input-group {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    #taskInput {
      padding: 12px 16px;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      font-size: 1em;
      transition: all 0.3s;
    }

    #taskInput:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    select {
      padding: 12px 12px;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      font-size: 0.95em;
      cursor: pointer;
      background: white;
      transition: all 0.3s;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Filter Section */
    .filter-section {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      background: #f0f0f0;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9em;
    }

    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }

    /* Search Section */
    .search-section {
      margin-bottom: 25px;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #dee2e6;
      border-radius: 6px;
      font-size: 0.95em;
      transition: all 0.3s;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    /* Task List */
    .tasks-section {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }

    .tasks-section::-webkit-scrollbar {
      width: 8px;
    }

    .tasks-section::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .tasks-section::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .tasks-section::-webkit-scrollbar-thumb:hover {
      background: #764ba2;
    }

    .task-card {
      background: #fff;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }

    .task-card:hover {
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }

    .task-card.completed {
      background: #f8f9fa;
      border-color: #dee2e6;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: #999;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 1em;
      font-weight: 500;
      margin-bottom: 6px;
      word-break: break-word;
      color: #333;
      transition: all 0.3s;
    }

    .task-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.8em;
    }

    .task-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-category {
      background: #e7f5ff;
      color: #0066cc;
    }

    .badge-priority-high {
      background: #ffe7e7;
      color: #cc0000;
    }

    .badge-priority-medium {
      background: #fff3e0;
      color: #e65100;
    }

    .badge-priority-low {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      font-size: 1.2em;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .btn-delete {
      color: #dc3545;
    }

    .btn-delete:hover {
      background: #ffe7e7;
    }

    .btn-edit {
      color: #667eea;
    }

    .btn-edit:hover {
      background: #e7f5ff;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 30px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .empty-state h3 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #666;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #e9ecef;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Alert Messages */
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8em;
      }

      .main-content {
        padding: 20px;
      }

      .input-group {
        grid-template-columns: 1fr;
      }

      .stats-section {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 1.8em;
      }

      .task-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .task-actions {
        width: 100%;
      }

      .filter-section {
        justify-content: space-between;
      }

      .filter-btn {
        flex: 1;
        min-width: 80px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        min-height: auto;
        border-radius: 8px;
      }

      .header {
        padding: 20px 15px;
      }

      .header h1 {
        font-size: 1.5em;
      }

      .main-content {
        padding: 15px;
      }

      .stats-section {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .stat-card {
        padding: 12px;
      }

      .stat-number {
        font-size: 1.5em;
      }

      .filter-btn {
        padding: 8px 12px;
        font-size: 0.8em;
      }

      button {
        padding: 10px 16px;
        font-size: 0.9em;
      }

      .task-title {
        font-size: 0.95em;
      }

      .task-meta {
        gap: 6px;
      }

      .task-badge {
        padding: 3px 8px;
        font-size: 0.7em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>📋 TaskFlow</h1>
      <p>Organize your tasks efficiently</p>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Alert Messages -->
      <div id="alert" class="alert"></div>

      <!-- Statistics -->
      <div class="stats-section">
        <div class="stat-card">
          <div class="stat-number" id="totalTasks">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="activeTasks">0</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="completedTasks">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>

      <!-- Input Section -->
      <div class="input-section">
        <div class="input-group">
          <input
            type="text"
            id="taskInput"
            placeholder="Add a new task..."
            aria-label="Task title"
          />
          <select id="categorySelect" aria-label="Task category">
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
          </select>
          <select id="prioritySelect" aria-label="Task priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
          <button id="addBtn" class="btn-primary" aria-label="Add task">Add</button>
        </div>
      </div>

      <!-- Search Section -->
      <div class="search-section">
        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="🔍 Search tasks..."
          aria-label="Search tasks"
        />
      </div>

      <!-- Filter Section -->
      <div class="filter-section">
        <button class="filter-btn active" data-filter="all" aria-label="Show all tasks">
          All
        </button>
        <button class="filter-btn" data-filter="active" aria-label="Show active tasks">
          Active
        </button>
        <button class="filter-btn" data-filter="completed" aria-label="Show completed tasks">
          Completed
        </button>
      </div>

      <!-- Tasks Section -->
      <div class="tasks-section" id="tasksList">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading tasks...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * TaskFlow - Frontend JavaScript
     * Handles all UI logic, DOM manipulation, and communication with backend
     */

    // State
    let state = {
      tasks: [],
      filteredTasks: [],
      currentFilter: 'all',
      searchQuery: '',
      isLoading: false,
    };

    // DOM Elements
    const taskInput = document.getElementById('taskInput');
    const categorySelect = document.getElementById('categorySelect');
    const prioritySelect = document.getElementById('prioritySelect');
    const addBtn = document.getElementById('addBtn');
    const searchInput = document.getElementById('searchInput');
    const tasksList = document.getElementById('tasksList');
    const alertBox = document.getElementById('alert');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Stat elements
    const totalTasksEl = document.getElementById('totalTasks');
    const activeTasksEl = document.getElementById('activeTasks');
    const completedTasksEl = document.getElementById('completedTasks');

    /**
     * Initialize the app
     */
    async function init() {
      try {
        showAlert('Loading tasks...', 'info');
        await loadTasks();
        setupEventListeners();
        renderTasks();
      } catch (error) {
        showAlert('Failed to load tasks: ' + error.message, 'error');
      }
    }

    /**
     * Setup event listeners
     */
    function setupEventListeners() {
      addBtn.addEventListener('click', handleAddTask);
      taskInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAddTask();
      });
      searchInput.addEventListener('input', handleSearch);
      filterBtns.forEach((btn) => {
        btn.addEventListener('click', handleFilterChange);
      });

      // Event delegation for task actions
      tasksList.addEventListener('change', (e) => {
        if (e.target.classList.contains('task-checkbox')) {
          handleToggleComplete(e);
        }
      });

      tasksList.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-delete')) {
          handleDeleteTask(e);
        }
        if (e.target.classList.contains('btn-edit')) {
          handleEditTask(e);
        }
      });
    }

    /**
     * Load tasks from Google Sheets
     */
    function loadTasks() {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler((tasks) => {
            state.tasks = tasks || [];
            applyFiltersAndSearch();
            updateStatistics();
            resolve();
          })
          .withFailureHandler((error) => {
            reject(error);
          })
          .getTasks();
      });
    }

    /**
     * Handle add task
     */
    async function handleAddTask() {
      const title = taskInput.value.trim();
      const category = categorySelect.value;
      const priority = prioritySelect.value;

      if (!title) {
        showAlert('Please enter a task title', 'error');
        taskInput.focus();
        return;
      }

      addBtn.disabled = true;
      try {
        const newTask = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((task) => resolve(task))
            .withFailureHandler((error) => reject(error))
            .addTask({ title, category, priority });
        });

        state.tasks.push(newTask);
        taskInput.value = '';
        applyFiltersAndSearch();
        updateStatistics();
        renderTasks();
        showAlert('Task added successfully!', 'success');
      } catch (error) {
        showAlert('Failed to add task: ' + error.message, 'error');
      } finally {
        addBtn.disabled = false;
        taskInput.focus();
      }
    }

    /**
     * Handle toggle complete
     */
    function handleToggleComplete(event) {
      const checkbox = event.target;
      const taskId = checkbox.closest('.task-card').dataset.taskId;
      const completed = checkbox.checked;

      google.script.run
        .withSuccessHandler(() => {
          const task = state.tasks.find((t) => t.id === taskId);
          if (task) {
            task.completed = completed;
            applyFiltersAndSearch();
            updateStatistics();
            renderTasks();
            showAlert(
              completed ? 'Task marked as complete!' : 'Task marked as incomplete!',
              'success'
            );
          }
        })
        .withFailureHandler((error) => {
          showAlert('Failed to update task: ' + error.message, 'error');
          renderTasks(); // Revert UI
        })
        .updateTask(taskId, { completed });
    }

    /**
     * Handle delete task
     */
    function handleDeleteTask(event) {
      if (!confirm('Are you sure you want to delete this task?')) {
        return;
      }

      const taskId = event.target.closest('.task-card').dataset.taskId;

      google.script.run
        .withSuccessHandler(() => {
          state.tasks = state.tasks.filter((t) => t.id !== taskId);
          applyFiltersAndSearch();
          updateStatistics();
          renderTasks();
          showAlert('Task deleted!', 'success');
        })
        .withFailureHandler((error) => {
          showAlert('Failed to delete task: ' + error.message, 'error');
        })
        .deleteTask(taskId);
    }

    /**
     * Handle edit task (simple inline edit)
     */
    function handleEditTask(event) {
      const taskCard = event.target.closest('.task-card');
      const taskId = taskCard.dataset.taskId;
      const titleEl = taskCard.querySelector('.task-title');
      const currentTitle = titleEl.textContent;

      const newTitle = prompt('Edit task title:', currentTitle);
      if (newTitle === null || newTitle.trim() === '') {
        return;
      }

      google.script.run
        .withSuccessHandler(() => {
          const task = state.tasks.find((t) => t.id === taskId);
          if (task) {
            task.title = newTitle.trim();
            renderTasks();
            showAlert('Task updated!', 'success');
          }
        })
        .withFailureHandler((error) => {
          showAlert('Failed to update task: ' + error.message, 'error');
        })
        .updateTask(taskId, { title: newTitle.trim() });
    }

    /**
     * Handle filter change
     */
    function handleFilterChange(event) {
      const filterValue = event.target.dataset.filter;
      state.currentFilter = filterValue;

      filterBtns.forEach((btn) => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      applyFiltersAndSearch();
      renderTasks();
    }

    /**
     * Handle search
     */
    function handleSearch(event) {
      state.searchQuery = event.target.value.toLowerCase();
      applyFiltersAndSearch();
      renderTasks();
    }

    /**
     * Apply filters and search
     */
    function applyFiltersAndSearch() {
      let filtered = [...state.tasks];

      // Apply filter
      if (state.currentFilter === 'active') {
        filtered = filtered.filter((t) => !t.completed);
      } else if (state.currentFilter === 'completed') {
        filtered = filtered.filter((t) => t.completed);
      }

      // Apply search
      if (state.searchQuery) {
        filtered = filtered.filter((t) =>
          t.title.toLowerCase().includes(state.searchQuery)
        );
      }

      state.filteredTasks = filtered;
    }

    /**
     * Update statistics
     */
    function updateStatistics() {
      const total = state.tasks.length;
      const active = state.tasks.filter((t) => !t.completed).length;
      const completed = state.tasks.filter((t) => t.completed).length;

      totalTasksEl.textContent = total;
      activeTasksEl.textContent = active;
      completedTasksEl.textContent = completed;
    }

    /**
     * Render tasks
     */
    function renderTasks() {
      if (state.filteredTasks.length === 0) {
        tasksList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>${state.searchQuery ? 'No matches found' : 'No tasks yet'}</h3>
            <p>${
              state.searchQuery
                ? 'Try a different search query'
                : 'Add a task to get started!'
            }</p>
          </div>
        `;
        return;
      }

      tasksList.innerHTML = state.filteredTasks
        .map((task) => createTaskElement(task))
        .join('');
    }

    /**
     * Create task element HTML
     */
    function createTaskElement(task) {
      const priorityClass = `badge-priority-${task.priority.toLowerCase()}`;
      const completedClass = task.completed ? 'completed' : '';

      return `
        <div class="task-card ${completedClass}" data-task-id="${task.id}">
          <input
            type="checkbox"
            class="task-checkbox"
            ${task.completed ? 'checked' : ''}
            aria-label="Mark task as ${task.completed ? 'incomplete' : 'complete'}"
          />
          <div class="task-content">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-meta">
              <span class="task-badge badge-category">${escapeHtml(task.category)}</span>
              <span class="task-badge ${priorityClass}">${escapeHtml(task.priority)}</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="btn-icon btn-edit" aria-label="Edit task" title="Edit">
              ✏️
            </button>
            <button class="btn-icon btn-delete" aria-label="Delete task" title="Delete">
              🗑️
            </button>
          </div>
        </div>
      `;
    }

    /**
     * Show alert message
     */
    function showAlert(message, type = 'info') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;

      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 3000);
    }

    /**
     * Escape HTML to prevent XSS
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize the app when DOM is ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
